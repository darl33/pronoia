name: pronoia

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Default kept below 49152 on purpose. Ports in the ephemeral range get
      # reserved by Hyper-V/WinNAT on Windows hosts, and Docker then fails to
      # bind with a "forbidden by its access permissions" error that looks like
      # a permissions problem rather than a taken port. Check with:
      #   netsh int ipv4 show excludedportrange protocol=tcp
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pronoia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pronoia_pgdata:
